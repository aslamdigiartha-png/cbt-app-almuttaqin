<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasbor Guru - CBT Bank Soal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        // PROTEKSI HALAMAN GURU & ADMIN
        const userRole = localStorage.getItem('userRole');
        if (localStorage.getItem('isLoggedIn') !== 'true' || (userRole !== 'guru' && userRole !== 'admin')) {
            alert("Akses Ditolak! Halaman ini hanya untuk Staf Sekolah.");
            window.location.href = "index.html";
        }

        function logout() {
            if(confirm("Apakah Anda yakin ingin keluar dari sistem?")) {
                localStorage.clear();
                window.location.href = "index.html";
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .wysiwyg-placeholder { min-height: 120px; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 flex h-screen overflow-hidden">

    <!-- Sidebar Navigasi -->
    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col h-full flex-shrink-0 transition-all z-20">
        <div class="h-16 flex items-center px-6 border-b border-slate-800 bg-slate-950">
            <i class="fa-solid fa-graduation-cap text-blue-500 text-xl mr-3"></i>
            <span class="text-white font-bold text-lg tracking-wide">CBT Panel <span class="text-xs text-blue-400 bg-blue-900/30 px-1.5 py-0.5 rounded ml-1">PRO</span></span>
        </div>
        
        <div class="p-4 flex-1 overflow-y-auto">
            <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-4 mt-2">Menu Utama</p>
            <ul class="space-y-1">
                <li><a href="#" class="flex items-center px-4 py-2.5 rounded-lg hover:bg-slate-800 hover:text-white transition"><i class="fa-solid fa-chart-pie w-6"></i> Dasbor</a></li>
                <li><a href="#" class="flex items-center px-4 py-2.5 rounded-lg bg-blue-600 text-white shadow-md transition"><i class="fa-solid fa-book-open w-6"></i> Bank Soal</a></li>
                <li><a href="#" class="flex items-center px-4 py-2.5 rounded-lg hover:bg-slate-800 hover:text-white transition"><i class="fa-solid fa-calendar-alt w-6"></i> Jadwal Ujian</a></li>
                <li><a href="#" class="flex items-center px-4 py-2.5 rounded-lg hover:bg-slate-800 hover:text-white transition"><i class="fa-solid fa-clipboard-check w-6"></i> Hasil & Nilai</a></li>
            </ul>
        </div>
        
        <div class="p-4 border-t border-slate-800">
            <button onclick="logout()" class="w-full flex justify-center items-center px-4 py-2.5 rounded-lg text-red-400 border border-red-900/50 hover:bg-red-900/30 transition text-sm font-semibold">
                <i class="fa-solid fa-power-off mr-2"></i> Keluar Sistem
            </button>
        </div>
    </aside>

    <!-- Konten Utama -->
    <main class="flex-1 flex flex-col h-full relative overflow-hidden">
        
        <!-- Navbar Atas -->
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 z-10 shadow-sm">
            <div class="flex items-center text-sm">
                <span class="text-slate-400">Bank Soal</span>
                <i class="fa-solid fa-chevron-right text-slate-300 text-xs mx-3"></i>
                <span class="font-semibold text-slate-700">Buat Soal Baru (ANBK)</span>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="text-right hidden md:block">
                    <p class="text-sm font-semibold text-slate-700" id="display-guru">Memuat...</p>
                    <p class="text-xs text-slate-500">SMP Islam Terpadu Al-Muttaqin</p>
                </div>
                <div class="w-9 h-9 rounded-full bg-blue-100 flex items-center justify-center text-blue-700 font-bold border border-blue-200">
                    G
                </div>
            </div>
        </header>

        <!-- Area Form Input Soal -->
        <div class="flex-1 overflow-y-auto p-6 lg:p-8">
            <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                
                <div class="p-6 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center">
                    <div>
                        <h2 class="text-lg font-bold text-slate-800">Editor Soal</h2>
                        <p class="text-sm text-slate-500">Pilih jenis soal untuk menyesuaikan format jawaban secara dinamis.</p>
                    </div>
                    <button class="px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white text-sm font-medium rounded-lg shadow transition">
                        <i class="fa-solid fa-save mr-2"></i> Simpan Soal
                    </button>
                </div>

                <div class="p-6 space-y-6">
                    <!-- Dropdown Tipe Soal -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Format Soal (Standar ANBK)</label>
                        <select id="tipeSoal" onchange="renderJawabanUI()" class="w-full lg:w-1/2 p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm transition">
                            <option value="pg">Pilihan Ganda Reguler (1 Jawaban Benar)</option>
                            <option value="pg_kompleks">Pilihan Ganda Kompleks (>1 Jawaban Benar)</option>
                            <option value="menjodohkan">Menjodohkan (Matriks Baris & Kolom)</option>
                        </select>
                    </div>

                    <hr class="border-slate-100">

                    <!-- Teks Stimulus -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Teks Stimulus / Wacana (Opsional)</label>
                        <div class="border border-slate-300 rounded-lg bg-white overflow-hidden">
                            <div class="bg-slate-100 px-3 py-2 border-b border-slate-200 flex gap-2 text-slate-600">
                                <button class="hover:text-slate-900 px-1"><i class="fa-solid fa-bold"></i></button>
                                <button class="hover:text-slate-900 px-1"><i class="fa-solid fa-italic"></i></button>
                                <button class="hover:text-slate-900 px-1"><i class="fa-solid fa-image"></i></button>
                                <button class="hover:text-slate-900 px-1"><i class="fa-solid fa-table"></i></button>
                            </div>
                            <textarea class="w-full p-3 outline-none text-sm wysiwyg-placeholder resize-y" placeholder="Masukkan bacaan, grafik, atau cerita di sini..."></textarea>
                        </div>
                    </div>

                    <!-- Teks Pertanyaan -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">Teks Pertanyaan <span class="text-red-500">*</span></label>
                        <textarea class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm resize-y" rows="3" placeholder="Tuliskan inti pertanyaan di sini..."></textarea>
                    </div>

                    <hr class="border-slate-100">

                    <!-- Kontainer Jawaban Dinamis yang dirender JS -->
                    <div>
                        <div class="flex items-center justify-between mb-4">
                            <label class="block text-sm font-semibold text-slate-700">Pilihan Jawaban & Kunci</label>
                            <span id="petunjukJawaban" class="text-xs text-blue-600 bg-blue-50 px-2 py-1 rounded border border-blue-100"></span>
                        </div>
                        <div id="jawabanContainer" class="space-y-3"></div>
                    </div>

                </div>
            </div>
            <div class="h-12"></div>
        </div>
    </main>

    <script>
        // Set nama user/role di Navbar
        document.addEventListener("DOMContentLoaded", () => {
            const role = localStorage.getItem('userRole');
            document.getElementById('display-guru').innerText = role === 'admin' ? "Administrator Utama" : "Guru Mata Pelajaran";
            renderJawabanUI(); // Render form pertama kali
        });

        const container = document.getElementById('jawabanContainer');
        const petunjuk = document.getElementById('petunjukJawaban');

        // Fungsi Render Dinamis Form Jawaban
        function renderJawabanUI() {
            const tipe = document.getElementById('tipeSoal').value;
            container.innerHTML = ''; 

            if (tipe === 'pg') {
                petunjuk.innerHTML = 'Pilih <strong class="text-blue-700">satu radio button</strong> sebagai kunci jawaban benar.';
                const labels = ['A', 'B', 'C', 'D', 'E'];
                labels.forEach((label, index) => {
                    container.innerHTML += `
                        <div class="flex items-start gap-3 p-3 border border-slate-200 rounded-lg hover:border-blue-300 bg-white transition group">
                            <div class="pt-2">
                                <input type="radio" name="kunci_pg" value="${index}" class="w-5 h-5 accent-blue-600 cursor-pointer" ${index === 0 ? 'checked' : ''}>
                            </div>
                            <div class="w-10 h-10 flex-shrink-0 bg-slate-100 rounded flex items-center justify-center font-bold text-slate-500 group-hover:bg-blue-50 group-hover:text-blue-600 transition">
                                ${label}
                            </div>
                            <input type="text" class="flex-1 p-2 border-b border-transparent hover:border-slate-300 focus:border-blue-500 focus:bg-blue-50/30 outline-none text-sm transition" placeholder="Tulis opsi jawaban ${label}...">
                        </div>
                    `;
                });
            } 
            else if (tipe === 'pg_kompleks') {
                petunjuk.innerHTML = 'Centang <strong class="text-blue-700">satu atau lebih checkbox</strong> sebagai kunci jawaban benar.';
                for(let i=1; i<=5; i++) {
                    container.innerHTML += `
                        <div class="flex items-start gap-3 p-3 border border-slate-200 rounded-lg hover:border-blue-300 bg-white transition group">
                            <div class="pt-2">
                                <input type="checkbox" name="kunci_pgk" value="${i}" class="w-5 h-5 accent-blue-600 cursor-pointer">
                            </div>
                            <input type="text" class="flex-1 p-2 border-b border-transparent hover:border-slate-300 focus:border-blue-500 focus:bg-blue-50/30 outline-none text-sm transition" placeholder="Tulis pernyataan opsi ${i}...">
                            <button class="text-slate-400 hover:text-red-500 px-2 pt-2 transition" title="Hapus baris"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    `;
                }
                container.innerHTML += `<button class="text-sm text-blue-600 hover:text-blue-800 font-medium mt-2"><i class="fa-solid fa-plus mr-1"></i> Tambah Opsi Lain</button>`;
            } 
            else if (tipe === 'menjodohkan') {
                petunjuk.innerHTML = 'Buat daftar <strong class="text-blue-700">Pernyataan (Kiri)</strong> dan <strong class="text-blue-700">Pilihan (Kanan)</strong>.';
                container.innerHTML = `
                    <div class="flex flex-col lg:flex-row gap-6">
                        <div class="flex-1 bg-slate-50 p-4 rounded-lg border border-slate-200">
                            <h3 class="text-sm font-bold text-slate-700 mb-3 border-b pb-2">Baris Pernyataan (Sisi Kiri)</h3>
                            <div class="space-y-2 mb-3">
                                <input type="text" class="w-full p-2 border border-slate-300 rounded text-sm outline-none focus:border-blue-500" placeholder="Pernyataan 1">
                                <input type="text" class="w-full p-2 border border-slate-300 rounded text-sm outline-none focus:border-blue-500" placeholder="Pernyataan 2">
                                <input type="text" class="w-full p-2 border border-slate-300 rounded text-sm outline-none focus:border-blue-500" placeholder="Pernyataan 3">
                            </div>
                            <button class="text-xs bg-white border border-slate-300 text-slate-600 px-3 py-1.5 rounded hover:bg-slate-100 transition shadow-sm">+ Tambah Pernyataan</button>
                        </div>
                        <div class="flex-1 bg-slate-50 p-4 rounded-lg border border-slate-200">
                            <h3 class="text-sm font-bold text-slate-700 mb-3 border-b pb-2">Kolom Jawaban (Sisi Kanan)</h3>
                            <div class="space-y-2 mb-3">
                                <input type="text" class="w-full p-2 border border-slate-300 rounded text-sm outline-none focus:border-blue-500" placeholder="Pilihan 1">
                                <input type="text" class="w-full p-2 border border-slate-300 rounded text-sm outline-none focus:border-blue-500" placeholder="Pilihan 2">
                                <input type="text" class="w-full p-2 border border-slate-300 rounded text-sm outline-none focus:border-blue-500" placeholder="Pilihan 3">
                            </div>
                            <button class="text-xs bg-white border border-slate-300 text-slate-600 px-3 py-1.5 rounded hover:bg-slate-100 transition shadow-sm">+ Tambah Pilihan</button>
                        </div>
                    </div>
                    <div class="mt-4 p-3 bg-yellow-50 border border-yellow-200 rounded text-xs text-yellow-800">
                        <i class="fa-solid fa-circle-info mr-1"></i> Setelah disimpan, antarmuka matriks untuk siswa akan dirender otomatis berdasarkan data baris dan kolom ini.
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
