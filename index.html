<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login - CBT Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .tab-transition { transition: all 0.3s ease-in-out; }
        .spinner { border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; width: 20px; height: 20px; animation: spin 1s ease-in-out infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-100 h-screen flex items-center justify-center font-sans bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">

    <div class="w-full max-w-4xl bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col md:flex-row">
        <!-- Banner Kiri -->
        <div class="md:w-5/12 bg-blue-800 text-white p-10 flex flex-col justify-between relative hidden md:flex">
            <div class="relative z-10">
                <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center text-blue-800 font-bold text-xl mb-6 shadow-lg"><i class="fa-solid fa-server"></i></div>
                <h1 class="text-3xl font-bold mb-2">CBT ENGINE PRO</h1>
                <p class="text-blue-200 text-sm leading-relaxed">Platform Asesmen Digital Terpadu Berbasis Cloud Database (Real-time). Mendukung keamanan tingkat tinggi.</p>
            </div>
            <div class="relative z-10 mt-10">
                <div class="bg-blue-900/50 p-4 rounded-lg border border-blue-700/50">
                    <p class="text-xs text-blue-200 mb-1">Status Server</p>
                    <p class="text-sm font-semibold text-green-400"><i class="fa-solid fa-wifi mr-2"></i> Terhubung ke Cloud</p>
                </div>
            </div>
        </div>

        <!-- Form Login -->
        <div class="md:w-7/12 p-8 md:p-12 bg-white flex flex-col justify-center">
            <div class="mb-8">
                <h2 class="text-2xl font-bold text-slate-800">Selamat Datang 👋</h2>
                <p class="text-slate-500 text-sm mt-1">Silakan masuk untuk mengakses sistem ujian terpadu.</p>
            </div>

            <!-- Tab Peran -->
            <div class="flex p-1 bg-slate-100 rounded-lg mb-8">
                <button onclick="switchTab('siswa')" id="tab-siswa" class="flex-1 py-2 text-sm font-semibold rounded-md shadow bg-white text-blue-700 tab-transition"><i class="fa-solid fa-user-graduate mr-2"></i> Siswa</button>
                <button onclick="switchTab('staf')" id="tab-staf" class="flex-1 py-2 text-sm font-semibold rounded-md text-slate-500 hover:text-slate-700 tab-transition"><i class="fa-solid fa-chalkboard-user mr-2"></i> Guru / Admin</button>
            </div>

            <!-- Pesan Error Dinamis -->
            <div id="error-msg" class="hidden mb-4 p-3 bg-red-100 border border-red-300 text-red-700 text-sm rounded-lg flex items-center">
                <i class="fa-solid fa-circle-exclamation mr-2"></i> <span id="error-text">Kredensial tidak valid!</span>
            </div>

            <form id="loginForm">
                <div class="space-y-5">
                    <div>
                        <label id="label-username" class="block text-sm font-medium text-slate-700 mb-1">Username / NISN</label>
                        <input type="text" id="username" required class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="Masukkan ID Anda">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Kata Sandi</label>
                        <input type="password" id="password" required class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="••••••••">
                    </div>
                </div>
                <button type="submit" id="btn-login" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg mt-8 shadow-lg flex justify-center items-center gap-2 transition">
                    <span id="btn-text">Verifikasi & Masuk</span>
                    <div id="loading-spinner" class="spinner"></div>
                </button>
            </form>
        </div>
    </div>

    <!-- Integrasi Firebase v9 (Modular SDK via CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // GANTI KONFIGURASI INI DENGAN DATA PROYEK FIREBASE ANDA
        const firebaseConfig = {
            apiKey: "AIzaSy_GANTI_DENGAN_API_KEY_ANDA",
            authDomain: "proyek-cbt-anda.firebaseapp.com",
            projectId: "proyek-cbt-anda",
            storageBucket: "proyek-cbt-anda.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdefghijklmn"
        };

        // Inisialisasi Firebase & Firestore
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // State UI
        window.currentRole = 'siswa';

        window.switchTab = function(role) {
            window.currentRole = role;
            const tabSiswa = document.getElementById('tab-siswa');
            const tabStaf = document.getElementById('tab-staf');
            const labelUsername = document.getElementById('label-username');
            const errorMsg = document.getElementById('error-msg');
            
            errorMsg.classList.add('hidden'); // Sembunyikan error saat pindah tab

            if (role === 'siswa') {
                tabSiswa.className = "flex-1 py-2 text-sm font-semibold rounded-md shadow bg-white text-blue-700 tab-transition";
                tabStaf.className = "flex-1 py-2 text-sm font-semibold rounded-md text-slate-500 hover:text-slate-700 tab-transition";
                labelUsername.innerText = "Nomor Induk Siswa (NISN)";
            } else {
                tabStaf.className = "flex-1 py-2 text-sm font-semibold rounded-md shadow bg-white text-blue-700 tab-transition";
                tabSiswa.className = "flex-1 py-2 text-sm font-semibold rounded-md text-slate-500 hover:text-slate-700 tab-transition";
                labelUsername.innerText = "Username / NIP";
            }
            document.getElementById('username').value = "";
            document.getElementById('password').value = "";
        };

        // Logika Eksekusi Login dengan Firestore
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const userVal = document.getElementById('username').value.trim();
            const passVal = document.getElementById('password').value.trim();
            
            // Animasi Loading
            const btnText = document.getElementById('btn-text');
            const spinner = document.getElementById('loading-spinner');
            const errorMsg = document.getElementById('error-msg');
            const errorText = document.getElementById('error-text');
            
            btnText.innerText = "Menghubungkan ke Server...";
            spinner.style.display = "block";
            errorMsg.classList.add('hidden');

            try {
                // Melakukan Query (Pencarian) ke Koleksi 'users' di Firestore
                const usersRef = collection(db, "users");
                const q = query(
                    usersRef, 
                    where("username", "==", userVal), 
                    where("password", "==", passVal),
                    where("role", "in", window.currentRole === 'siswa' ? ["siswa"] : ["guru", "admin"])
                );
                
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    // Jika data tidak ditemukan
                    errorText.innerText = "Username atau Password salah!";
                    errorMsg.classList.remove('hidden');
                } else {
                    // Jika data ditemukan (Login Sukses)
                    let userData;
                    querySnapshot.forEach((doc) => { userData = doc.data(); });

                    // Simpan Token Sesi ke LocalStorage (Sebagai penanda otorisasi sementara untuk halaman lain)
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userName', userData.username);
                    localStorage.setItem('userRealName', userData.nama);
                    localStorage.setItem('userRole', userData.role);

                    // Pengalihan halaman
                    if (userData.role === 'siswa') {
                        window.location.href = "siswa.html";
                    } else {
                        window.location.href = "guru.html";
                    }
                }
            } catch (error) {
                console.error("Firebase Error:", error);
                errorText.innerText = "Gagal terhubung ke Database. Periksa koneksi internet Anda.";
                errorMsg.classList.remove('hidden');
            } finally {
                // Matikan loading
                btnText.innerText = "Verifikasi & Masuk";
                spinner.style.display = "none";
            }
        });
    </script>
</body>
</html>
