<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login - CBT Sekolah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        // Cek jika sudah login, langsung arahkan ke dasbor masing-masing
        if (localStorage.getItem('isLoggedIn') === 'true') {
            const role = localStorage.getItem('userRole');
            if (role === 'siswa') window.location.href = "siswa.html";
            if (role === 'guru' || role === 'admin') window.location.href = "guru.html";
        }
    </script>
</head>
<body class="bg-slate-100 h-screen flex items-center justify-center font-sans bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">
    <div class="w-full max-w-4xl bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col md:flex-row">
        <!-- Banner Kiri -->
        <div class="md:w-5/12 bg-blue-800 text-white p-10 flex flex-col justify-between hidden md:flex">
            <div>
                <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center text-blue-800 font-bold text-xl mb-6 shadow-lg"><i class="fa-solid fa-graduation-cap"></i></div>
                <h1 class="text-3xl font-bold mb-2">CBT SIMULATOR</h1>
                <p class="text-blue-200 text-sm">Platform Asesmen Digital Terpadu SMP Islam Terpadu Al-Muttaqin.</p>
            </div>
        </div>

        <!-- Form Login Kanan -->
        <div class="md:w-7/12 p-8 md:p-12">
            <h2 class="text-2xl font-bold text-slate-800 mb-6">Selamat Datang 👋</h2>
            
            <div class="flex p-1 bg-slate-100 rounded-lg mb-6">
                <button onclick="switchRole('siswa')" id="btn-siswa" class="flex-1 py-2 text-sm font-semibold rounded-md shadow bg-white text-blue-700 transition">Siswa</button>
                <button onclick="switchRole('staf')" id="btn-staf" class="flex-1 py-2 text-sm font-semibold rounded-md text-slate-500 hover:text-slate-700 transition">Guru / Admin</button>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label id="label-username" class="block text-sm font-medium text-slate-700 mb-1">Nomor Induk Siswa (NISN)</label>
                    <input type="text" id="username" required class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Masukkan NISN">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Kata Sandi</label>
                    <input type="password" id="password" required class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-lg mt-4 transition">Masuk ke Sistem</button>
            </form>
        </div>
    </div>

    <script>
        let currentRole = 'siswa';

        function switchRole(role) {
            currentRole = role;
            document.getElementById('btn-siswa').className = role === 'siswa' ? "flex-1 py-2 text-sm font-semibold rounded-md shadow bg-white text-blue-700 transition" : "flex-1 py-2 text-sm font-semibold rounded-md text-slate-500 transition";
            document.getElementById('btn-staf').className = role === 'staf' ? "flex-1 py-2 text-sm font-semibold rounded-md shadow bg-white text-blue-700 transition" : "flex-1 py-2 text-sm font-semibold rounded-md text-slate-500 transition";
            document.getElementById('label-username').innerText = role === 'siswa' ? "Nomor Induk Siswa (NISN)" : "Username / NIP";
            document.getElementById('username').value = "";
        }

        function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value.toLowerCase();
            
            // Set Sesi
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('userName', username);

            if (currentRole === 'siswa') {
                localStorage.setItem('userRole', 'siswa');
                window.location.href = "siswa.html";
            } else {
                localStorage.setItem('userRole', username === 'admin' ? 'admin' : 'guru');
                window.location.href = "guru.html";
            }
        }
    </script>
</body>
</html>
