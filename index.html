<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login - CBT Sekolah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .tab-transition { transition: all 0.3s ease-in-out; }
    </style>
    <script>
        // Pengecekan Sesi Aktif
        if (localStorage.getItem('isLoggedIn') === 'true') {
            const role = localStorage.getItem('userRole');
            if (role === 'siswa') window.location.href = "siswa.html";
            else if (role === 'guru' || role === 'admin') window.location.href = "guru.html";
        }
    </script>
</head>
<body class="bg-slate-100 h-screen flex items-center justify-center font-sans bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">

    <div class="w-full max-w-4xl bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col md:flex-row">
        <!-- Banner Info (Kiri) -->
        <div class="md:w-5/12 bg-blue-800 text-white p-10 flex flex-col justify-between relative overflow-hidden hidden md:flex">
            <div class="relative z-10">
                <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center text-blue-800 font-bold text-xl mb-6 shadow-lg">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <h1 class="text-3xl font-bold mb-2">CBT SIMULATOR</h1>
                <p class="text-blue-200 text-sm leading-relaxed">Platform Asesmen Digital Terpadu SMP Islam Terpadu Al-Muttaqin. Mendukung format ANBK.</p>
            </div>
            <div class="relative z-10 mt-10">
                <div class="bg-blue-900/50 p-4 rounded-lg border border-blue-700/50">
                    <p class="text-xs text-blue-200 mb-1">Pusat Bantuan Ujian</p>
                    <p class="text-sm font-semibold"><i class="fa-solid fa-headset mr-2"></i> Hubungi Proktor Sekolah</p>
                </div>
            </div>
            <!-- Dekorasi -->
            <div class="absolute -bottom-10 -right-10 w-64 h-64 bg-blue-600 rounded-full mix-blend-multiply filter blur-2xl opacity-50"></div>
            <div class="absolute -top-10 -left-10 w-40 h-40 bg-blue-500 rounded-full mix-blend-multiply filter blur-xl opacity-50"></div>
        </div>

        <!-- Form Login (Kanan) -->
        <div class="md:w-7/12 p-8 md:p-12 bg-white flex flex-col justify-center">
            <div class="mb-8">
                <h2 class="text-2xl font-bold text-slate-800">Selamat Datang 👋</h2>
                <p class="text-slate-500 text-sm mt-1">Silakan masuk menggunakan akun yang telah terdaftar.</p>
            </div>

            <!-- Tab Role -->
            <div class="flex p-1 bg-slate-100 rounded-lg mb-8 relative">
                <button onclick="switchTab('siswa')" id="tab-siswa" class="flex-1 py-2 text-sm font-semibold rounded-md shadow bg-white text-blue-700 tab-transition">
                    <i class="fa-solid fa-user-graduate mr-2"></i> Siswa
                </button>
                <button onclick="switchTab('staf')" id="tab-staf" class="flex-1 py-2 text-sm font-semibold rounded-md text-slate-500 hover:text-slate-700 tab-transition">
                    <i class="fa-solid fa-chalkboard-user mr-2"></i> Guru / Admin
                </button>
            </div>

            <form onsubmit="handleLogin(event)">
                <div class="space-y-5">
                    <div>
                        <label id="label-username" class="block text-sm font-medium text-slate-700 mb-1">Nomor Induk Siswa (NISN)</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fa-regular fa-user text-slate-400"></i>
                            </div>
                            <input type="text" id="username" required class="w-full pl-10 pr-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition text-sm" placeholder="Masukkan NISN Anda">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Kata Sandi</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fa-solid fa-lock text-slate-400"></i>
                            </div>
                            <input type="password" id="password" required class="w-full pl-10 pr-10 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition text-sm" placeholder="••••••••">
                            <div class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer" onclick="togglePassword()">
                                <i id="eye-icon" class="fa-regular fa-eye text-slate-400 hover:text-slate-600 transition"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg mt-8 transition shadow-lg shadow-blue-600/30 flex justify-center items-center">
                    Masuk ke Sistem <i class="fa-solid fa-arrow-right-to-bracket ml-2"></i>
                </button>
            </form>
            
            <div class="mt-8 text-center text-xs text-slate-400 font-medium">
                CBT Engine &copy; 2026 ASLAM DigiArtha
            </div>
        </div>
    </div>

    <script>
        let currentRole = 'siswa';

        function switchTab(role) {
            currentRole = role;
            const tabSiswa = document.getElementById('tab-siswa');
            const tabStaf = document.getElementById('tab-staf');
            const labelUsername = document.getElementById('label-username');
            const inputUsername = document.getElementById('username');

            if (role === 'siswa') {
                tabSiswa.className = "flex-1 py-2 text-sm font-semibold rounded-md shadow bg-white text-blue-700 tab-transition";
                tabStaf.className = "flex-1 py-2 text-sm font-semibold rounded-md text-slate-500 hover:text-slate-700 tab-transition";
                labelUsername.innerText = "Nomor Induk Siswa (NISN)";
                inputUsername.placeholder = "Masukkan NISN Anda";
            } else {
                tabStaf.className = "flex-1 py-2 text-sm font-semibold rounded-md shadow bg-white text-blue-700 tab-transition";
                tabSiswa.className = "flex-1 py-2 text-sm font-semibold rounded-md text-slate-500 hover:text-slate-700 tab-transition";
                labelUsername.innerText = "Username / NIP";
                inputUsername.placeholder = "Masukkan Username atau NIP";
            }
            inputUsername.value = "";
        }

        function togglePassword() {
            const pwdInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            if (pwdInput.type === "password") {
                pwdInput.type = "text";
                eyeIcon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                pwdInput.type = "password";
                eyeIcon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            const userVal = document.getElementById('username').value.toLowerCase();
            
            // Simpan Data Sesi
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('userName', userVal);

            // Alihkan berdasarkan peran
            if (currentRole === 'siswa') {
                localStorage.setItem('userRole', 'siswa');
                window.location.href = "siswa.html"; 
            } else {
                localStorage.setItem('userRole', userVal === 'admin' ? 'admin' : 'guru');
                window.location.href = "guru.html"; 
            }
        }
    </script>
</body>
</html>
