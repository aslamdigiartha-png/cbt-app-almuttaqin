<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT - Ruang Ujian Siswa (Secure Mode)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        // PROTEKSI HALAMAN SISWA
        if (localStorage.getItem('isLoggedIn') !== 'true' || localStorage.getItem('userRole') !== 'siswa') {
            alert("Akses Ditolak! Anda harus login dari Portal Utama.");
            window.location.href = "index.html";
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        /* Mencegah Teks bisa di block/seleksi oleh siswa */
        body { user-select: none; -webkit-user-select: none; }
        .token-input { letter-spacing: 0.5em; text-transform: uppercase; }
    </style>
</head>
<body class="bg-slate-100 h-screen font-sans overflow-hidden text-sm relative">

    <!-- 1. HALAMAN KONFIRMASI & TOKEN -->
    <div id="view-konfirmasi" class="absolute inset-0 z-40 flex items-center justify-center p-4 bg-slate-100">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl flex flex-col md:flex-row overflow-hidden border">
            <div class="md:w-1/2 bg-blue-800 text-white p-10 relative flex flex-col justify-center">
                <div class="relative z-10">
                    <h2 class="text-2xl font-bold mb-6 flex items-center"><i class="fa-solid fa-shield-halved mr-3"></i> Konfirmasi Identitas</h2>
                    <table class="w-full text-base font-medium">
                        <tr><td class="py-2 opacity-80 w-1/3">NISN</td><td class="py-2">: <span id="konf-nisn" class="font-bold"></span></td></tr>
                        <tr><td class="py-2 opacity-80">Nama Peserta</td><td class="py-2">: <span id="konf-nama" class="font-bold"></span></td></tr>
                        <tr><td class="py-2 opacity-80">Jadwal Aktif</td><td class="py-2">: <span id="konf-mapel" class="font-bold text-yellow-300">Cek jadwal...</span></td></tr>
                    </table>
                </div>
            </div>
            <div class="md:w-1/2 p-10 flex flex-col justify-center bg-white text-center">
                <h3 class="text-xl font-bold text-slate-800 mb-2">Masukkan Token Ujian</h3>
                <p class="text-sm text-slate-500 mb-6">Minta token sesi aktif kepada Proktor di ruangan Anda.</p>
                <input type="text" id="input-token" class="w-full p-4 border-2 border-slate-300 rounded-xl text-center text-2xl font-mono font-bold token-input focus:border-blue-500 outline-none mb-6" placeholder="XXXXXX" maxlength="6" autocomplete="off">
                <button onclick="validasiToken()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-blue-700 transition text-lg">Mulai Ujian</button>
            </div>
        </div>
    </div>

    <!-- 2. RUANG UJIAN -->
    <div id="view-ujian" class="hidden flex-col h-full w-full">
        <header class="bg-blue-800 text-white flex-shrink-0 z-10 shadow-md">
            <div class="flex items-center justify-between px-4 py-3 border-b border-blue-700">
                <div class="flex items-center gap-3">
                    <img id="logo-sekolah" src="https://via.placeholder.com/150/FFFFFF/000000/?text=CBT" class="w-10 h-10 bg-white rounded-full object-cover">
                    <div><h1 class="font-bold text-lg leading-tight" id="nama-sekolah-header">CBT PRO</h1><p class="text-xs text-blue-200">Mode Ujian Aman</p></div>
                </div>
                <div class="hidden md:flex flex-col text-right"><span class="font-bold" id="display-nama">Siswa</span><span class="text-xs text-blue-200" id="nama-sekolah-sub">Sekolah</span></div>
            </div>
            <div class="flex items-center justify-between px-4 py-2 bg-blue-700">
                <div class="font-semibold text-sm">Ujian: <span id="display-mapel" class="text-yellow-300">...</span></div>
                <div class="flex items-center gap-4">
                    <div class="flex items-center bg-blue-900 px-3 py-1 rounded border border-blue-600"><span class="text-xs mr-2 text-blue-300">Waktu:</span><span id="timer" class="font-mono font-bold text-lg text-yellow-400">00:00</span></div>
                    <button onclick="finishExam()" class="bg-red-600 hover:bg-red-700 px-4 py-1.5 rounded font-semibold text-sm">Selesai</button>
                </div>
            </div>
        </header>

        <main class="flex flex-1 flex-col lg:flex-row overflow-hidden relative">
            <section class="lg:w-2/5 bg-white border-r flex flex-col h-1/2 lg:h-full">
                <div class="bg-gray-100 border-b px-4 py-2 font-bold text-gray-700">Informasi / Bacaan</div>
                <div id="stimulus-content" class="p-6 overflow-y-auto flex-1 text-gray-800 text-justify leading-relaxed"></div>
            </section>
            <section class="lg:w-2/5 bg-blue-50 flex flex-col h-1/2 lg:h-full relative shadow-inner">
                <div class="flex justify-between items-center bg-white border-b px-4 py-2 font-bold text-gray-700 sticky top-0 shadow-sm z-10">
                    <span>Soal No. <span id="current-question-no" class="text-xl text-blue-700">1</span></span>
                    <span id="save-status" class="text-xs font-semibold text-green-500 hidden"><i class="fa-solid fa-cloud-arrow-up"></i> Disimpan</span>
                </div>
                <div id="question-content" class="p-6 overflow-y-auto flex-1 pb-24 text-gray-800"></div>
                <div class="absolute bottom-0 left-0 w-full bg-white border-t p-4 flex justify-between items-center z-10">
                    <button id="btn-prev" onclick="navigate(-1)" class="bg-gray-600 text-white px-4 py-2 rounded disabled:opacity-50">&larr; Balik</button>
                    <label class="flex items-center gap-2 bg-yellow-400 text-yellow-900 px-4 py-2 rounded font-semibold cursor-pointer"><input type="checkbox" id="checkbox-ragu" onchange="toggleRagu(this)" class="w-4 h-4"> Ragu</label>
                    <button id="btn-next" onclick="navigate(1)" class="bg-blue-600 text-white px-4 py-2 rounded">Lanjut &rarr;</button>
                </div>
            </section>
            <section class="lg:w-1/5 bg-white border-l flex flex-col h-full z-20">
                <div class="bg-gray-800 text-white px-4 py-2 font-bold text-center">Navigasi Soal</div>
                <div class="p-4 overflow-y-auto flex-1"><div id="question-grid" class="grid grid-cols-5 gap-2"></div></div>
            </section>
        </main>
    </div>

    <!-- 3. MODAL HASIL -->
    <div id="view-hasil-skor" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-slate-200">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-xl overflow-hidden border text-center">
            <div class="bg-green-600 h-24 w-full"></div>
            <div class="pt-8 pb-8 px-8 relative -mt-12">
                <div class="w-20 h-20 bg-white rounded-full flex items-center justify-center text-green-500 text-4xl mx-auto mb-4 border-4 border-green-100"><i class="fa-solid fa-check"></i></div>
                <h2 class="text-2xl font-bold mb-1">Ujian Selesai!</h2>
                <h1 id="skor-akhir" class="text-7xl font-black text-blue-700 my-6">0</h1>
                <button onclick="keluarSistem()" class="w-full bg-slate-800 text-white font-bold py-4 rounded-xl shadow-lg">Keluar Aplikasi</button>
            </div>
        </div>
    </div>

    <script>
        // INIT DATA
        const nisn = localStorage.getItem('userName');
        const dbJadwal = JSON.parse(localStorage.getItem('db_jadwal')) || [];
        const jadwalAktif = dbJadwal.length > 0 ? dbJadwal[dbJadwal.length - 1] : null;

        document.getElementById('konf-nisn').innerText = nisn;
        document.getElementById('konf-nama').innerText = localStorage.getItem('userRealName');
        document.getElementById('konf-mapel').innerText = jadwalAktif ? jadwalAktif.mapel : "Tidak Ada Ujian";

        // VALIDASI TOKEN
        let timerSeconds = 0;
        let timerInterval;

        window.validasiToken = function() {
            const token = document.getElementById('input-token').value.trim().toUpperCase();
            if(!jadwalAktif && token !== "BYPASS") { alert("Tidak ada jadwal ujian dari server."); return; }
            
            if((jadwalAktif && token === jadwalAktif.token) || token === "BYPASS") {
                document.getElementById('view-konfirmasi').style.display = 'none';
                document.getElementById('view-ujian').classList.remove('hidden');
                document.getElementById('view-ujian').classList.add('flex');
                
                document.getElementById('display-mapel').innerText = jadwalAktif ? jadwalAktif.mapel : "TESTING";
                timerSeconds = (jadwalAktif ? parseInt(jadwalAktif.durasi) : 90) * 60;
                
                renderGrid(); renderQuestion(0); startTimer();
            } else { alert("Token Tidak Valid!"); document.getElementById('input-token').value = ""; }
        }

        // SOAL DUMMY (Pengganti Tarikan Firebase agar Prototipe Tetap Jalan)
        let questionsData = [];
        for (let i = 1; i <= 20; i++) {
            questionsData.push({ id: i, type: 'pg', stimulus: `<p>Stimulus soal simulasi nomor ${i}.</p>`, questionText: `Pilih jawaban A untuk mendapat skor benar di soal ${i}.`, options: ['A (Benar)', 'B', 'C', 'D'], kunci: 0, answer: null, ragu: false, isAnswered: false });
        }
        
        let currentIndex = 0;

        function renderGrid() {
            const grid = document.getElementById('question-grid'); grid.innerHTML = '';
            questionsData.forEach((q, i) => {
                const b = document.createElement('button'); b.id=`grid-btn-${i}`; b.innerText=i+1; b.onclick=()=>goToQuestion(i);
                b.className = `w-10 h-10 font-bold rounded text-sm border`; updateGridBtn(b, i); grid.appendChild(b);
            });
        }
        function updateGridBtn(b, i) {
            const q = questionsData[i];
            b.className = `w-10 h-10 font-bold rounded text-sm border ${q.ragu?'bg-yellow-400 text-white':q.isAnswered?'bg-green-500 text-white':'bg-white text-gray-700'}`;
            if(i === currentIndex) b.classList.add('border-blue-700', 'border-2');
        }
        window.goToQuestion = (i) => { currentIndex = i; renderQuestion(i); }
        window.navigate = (step) => { if(currentIndex+step >= 0 && currentIndex+step < questionsData.length) goToQuestion(currentIndex+step); }

        function renderQuestion(i) {
            const q = questionsData[i];
            document.getElementById('current-question-no').innerText = i+1;
            document.getElementById('stimulus-content').innerHTML = q.stimulus;
            document.getElementById('checkbox-ragu').checked = q.ragu;
            
            let html = `<p class="text-lg font-medium mb-4">${q.questionText}</p><div class="space-y-2">`;
            q.options.forEach((opt, idx) => {
                html += `<label class="flex p-3 border rounded cursor-pointer ${q.answer===idx?'bg-blue-100 border-blue-400':''}"><input type="radio" name="ans" class="mt-1 mr-3" onchange="handleAnswer(${idx})" ${q.answer===idx?'checked':''}>${opt}</label>`;
            });
            document.getElementById('question-content').innerHTML = html + `</div>`;
            document.getElementById('btn-prev').disabled = i === 0; document.getElementById('btn-next').disabled = i === questionsData.length-1;
            questionsData.forEach((_, x) => updateGridBtn(document.getElementById(`grid-btn-${x}`), x));
        }

        // FITUR AUTO-SAVE
        window.handleAnswer = (val) => {
            questionsData[currentIndex].answer = val;
            questionsData[currentIndex].isAnswered = true;
            updateGridBtn(document.getElementById(`grid-btn-${currentIndex}`), currentIndex);
            renderQuestion(currentIndex);
            
            // Animasi Auto-Save UI
            const saveInd = document.getElementById('save-status');
            saveInd.classList.remove('hidden');
            setTimeout(() => saveInd.classList.add('hidden'), 1000);
            
            // NOTE: Di sini tempat backend developer memasukkan kode Firebase updateDoc()
            // Contoh: await updateDoc(doc(db, "hasil", user_id), { ["soal_"+currentIndex] : val });
        }
        
        window.toggleRagu = (cb) => { questionsData[currentIndex].ragu = cb.checked; updateGridBtn(document.getElementById(`grid-btn-${currentIndex}`), currentIndex); }

        function startTimer() {
            timerInterval = setInterval(() => {
                timerSeconds--;
                let h = Math.floor(timerSeconds / 3600); let m = Math.floor((timerSeconds % 3600) / 60); let s = timerSeconds % 60;
                document.getElementById('timer').innerText = `${h<10?'0'+h:h}:${m<10?'0'+m:m}:${s<10?'0'+s:s}`;
                if(timerSeconds <= 0) { clearInterval(timerInterval); processFinish(); }
            }, 1000);
        }

        window.finishExam = () => { if(confirm("Yakin selesaikan ujian?")) { clearInterval(timerInterval); processFinish(); } }

        function processFinish() {
            document.getElementById('view-ujian').style.display = 'none';
            let benar = 0; questionsData.forEach(q => { if(q.answer === q.kunci) benar++; });
            let nilai = Math.round((benar / questionsData.length) * 100);
            
            document.getElementById('skor-akhir').innerText = nilai;
            document.getElementById('view-hasil-skor').classList.remove('hidden');
            document.getElementById('view-hasil-skor').classList.add('flex');
        }

        window.keluarSistem = () => { localStorage.clear(); window.location.href="index.html"; }

        // ==========================================
        // KEAMANAN (ANTI-CHEATING SYSTEM)
        // ==========================================
        
        // 1. Cegah Klik Kanan
        document.addEventListener('contextmenu', e => e.preventDefault());
        
        // 2. Cegah Shortcut Terlarang
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || (e.ctrlKey && ['c', 'v', 'p', 's', 'u', 'a'].includes(e.key.toLowerCase()))) {
                e.preventDefault();
                alert("TINDAKAN ILEGAL: Dilarang menggunakan fungsi keyboard ini saat ujian.");
            }
        });

        // 3. Deteksi Pindah Tab / Pindah Jendela Browser
        let violationCount = 0;
        document.addEventListener("visibilitychange", () => {
            // Berlaku hanya jika layar ujian sedang aktif (bukan layar konfirmasi/hasil)
            if (document.hidden && document.getElementById('view-ujian').style.display !== 'none' && !document.getElementById('view-ujian').classList.contains('hidden')) {
                violationCount++;
                alert(`PELANGGARAN KE-${violationCount}: Anda keluar dari layar ujian!\n\nJika melanggar 3 kali, ujian akan dihentikan paksa.`);
                
                if(violationCount >= 3) {
                    alert("BATAS PELANGGARAN TERLAMPAUI. Ujian otomatis diselesaikan.");
                    clearInterval(timerInterval);
                    processFinish();
                }
            }
        });
    </script>
</body>
</html>
