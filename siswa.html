<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Ujian</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // PROTEKSI KHUSUS SISWA
        if (localStorage.getItem('isLoggedIn') !== 'true' || localStorage.getItem('userRole') !== 'siswa') {
            alert("Akses Ditolak! Khusus Siswa.");
            window.location.href = "index.html";
        }
    </script>
</head>
<body class="bg-gray-200 h-screen flex flex-col font-sans">
    <header class="bg-blue-800 text-white flex justify-between p-4 shadow-md">
        <h1 class="font-bold text-lg">CBT ANBK - Siswa</h1>
        <div class="flex gap-4 items-center">
            <span id="display-nama" class="font-bold"></span>
            <button onclick="logoutSiswa()" class="bg-red-600 px-4 py-1 rounded text-sm font-semibold">Selesai Ujian</button>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center">
        <div class="bg-white p-10 rounded-xl shadow-xl text-center">
            <h2 class="text-2xl font-bold mb-4">Ujian Sedang Berlangsung</h2>
            <p class="text-gray-600 mb-8">Kerjakan soal dengan jujur dan teliti.</p>
            <div class="animate-pulse w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto text-xl font-bold">...</div>
        </div>
    </main>

    <script>
        document.getElementById('display-nama').innerText = "NISN: " + localStorage.getItem('userName').toUpperCase();

        function logoutSiswa() {
            if(confirm("Yakin ingin menyelesaikan ujian? Data akan disimpan.")) {
                localStorage.clear();
                window.location.href = "index.html";
            }
        }
    </script>
</body>
</html>
